<form class="appointment-form" [formGroup]="formGroup" (ngSubmit)="onSave()">
  <app-dropdown
    formControlName="eventsType"
    name="eventsType"
    [field]="formGroup"
    label="Tipo de evento *"
    [options]="eventTypes"
    optionLabel="name" />

  <div class="date-grid">
    <app-input-date formControlName="initialDate" name="initialDate" [field]="formGroup" label="Início *" [showTime]="true" />
    <app-input-date formControlName="finalDate" name="finalDate" [field]="formGroup" label="Fim *" [showTime]="true" />
  </div>

  <div class="field">
    <label for="local">Local *</label>
    <input id="local" type="text" pInputText formControlName="local">
  </div>

  <div class="field">
    <label for="description">Descrição</label>
    <textarea id="description" rows="3" pInputText formControlName="description"></textarea>
  </div>

  @if (!isExisting) {
    <div class="field">
      <label for="recurrenceType">Recorrência</label>
      <select id="recurrenceType" formControlName="recurrenceType">
        <option value="NONE">Não repetir</option>
        <option value="WEEKLY">Semanal</option>
      </select>
    </div>

    @if (weekly) {
      <fieldset class="week-days">
        <legend>Dias da semana *</legend>
        @for (day of weekDays; track day.value) {
          <label>
            <input
              type="checkbox"
              [checked]="selectedWeekDays.has(day.value)"
              (change)="toggleWeekDay(day.value, $any($event.target).checked)">
            {{ day.label }}
          </label>
        }
      </fieldset>
      <app-input-date formControlName="recurrenceEndDate" name="recurrenceEndDate" [field]="formGroup" label="Repetir até *" />
    }
  }

  @if (formGroup.get('status')?.value === 'CANCELLED') {
    <p class="cancelled-message">Este compromisso está cancelado.</p>
  }

  <div class="actions">
    @if (isExisting) {
      <p-button
        severity="danger"
        [outlined]="true"
        label="Excluir"
        type="button"
        (onClick)="deleteEvent()" />
      @if (formGroup.get('status')?.value !== 'CANCELLED') {
        <p-button
          severity="warn"
          [outlined]="true"
          label="Cancelar evento"
          type="button"
          (onClick)="cancelEvent()" />
      }
    }
    <span class="actions__spacer"></span>
    <p-button [outlined]="true" label="Fechar" type="button" (onClick)="onCancel()" />
    <p-button label="Salvar" type="submit" />
  </div>
</form>
