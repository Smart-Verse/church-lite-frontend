<app-loading [showLoading]="showLoading"></app-loading>
<section class="person-page">
  <nav class="person-page__breadcrumb" aria-label="Breadcrumb">
    <p-breadcrumb [model]="breadcrumbItems" [home]="breadcrumbHome" />
  </nav>

  <header class="person-page__header">
    <div class="person-page__heading">
      <h1>{{ translatePersonMembers.translate(pageTitle) }}</h1>
      <p>{{ translatePersonMembers.translate(personId ? "personal_page_edit_description" : "personal_page_create_description") }}</p>
    </div>
    <div class="person-page__actions">
      <p-button type="button" [outlined]="true" [label]="translatePersonMembers.translate('common_action_cancel')" (onClick)="onCancel()" />
      <p-button type="button" icon="pi pi-check" [disabled]="isSaving" [label]="translatePersonMembers.translate('common_action_save')" (onClick)="onSave()" />
    </div>
  </header>

  <main class="person-page__body">
    <div [formGroup]="personFormGroup">
  <p-tabs value="0">
    <p-tablist>
      <p-tab value="0">Dados Básicos</p-tab>
      <p-tab value="1">Contato</p-tab>
      <p-tab value="2">Endereço</p-tab>
      @if (showMinisterial) {
        <p-tab value="3">Ministerial</p-tab>
      }
    </p-tablist>
    <p-tabpanels>
    <p-tabpanel value="0">
      <div class="person-members fields-grid">
        <div class="group-image col-12 md:col-12">
          <div class="image-container">
            <app-image-upload
              [imageUrl]="urlImage"
              (eventLoading)="loading()"
              (eventImageToken)="onGetTokenImage($event)"
              [tokenImageUrl]="imageToken">
            </app-image-upload>
          </div>
          <div class="fields-grid">
            <app-input-text
              formControlName="name"
              name="name"
              [field]="personFormGroup"
              class="field col-12 md:col-8 c-margin"
              [label]="translatePersonMembers.translate('personal_field_name')"
              type="text">
            </app-input-text>
            <app-dropdown
              formControlName="status"
              name="status"
              [field]="personFormGroup"
              [label]="translatePersonMembers.translate('personal_field_status')"
              [options]="_status"
              optionLabel="value"
              class="field col-12 md:col-4 c-margin">
            </app-dropdown>
            <app-dropdown
              formControlName="gender"
              name="gender"
              [field]="personFormGroup"
              [label]="translatePersonMembers.translate('personal_field_gender')"
              [options]="_gender"
              optionLabel="value"
              class="field col-12 md:col-6 c-margin">
            </app-dropdown>
            <app-dropdown
              formControlName="maritalStatus"
              name="maritalStatus"
              [field]="personFormGroup"
              [label]="translatePersonMembers.translate('personal_field_maritalStatus')"
              [options]="_maritalStatus"
              optionLabel="value"
              class="field col-12 md:col-6 c-margin">
            </app-dropdown>
            <app-auto-complete
              formControlName="nationality"
              name="nationality"
              [field]="personFormGroup"
              class="field col-12 md:col-6 c-margin"
              [label]="translatePersonMembers.translate('personal_field_nationality')"
              route="country"
              optionLabel="name"
              type="text">
            </app-auto-complete>
            <app-input-text
              formControlName="birthplace"
              name="birthplace"
              [field]="personFormGroup"
              class="field col-12 md:col-6 c-margin"
              [label]="translatePersonMembers.translate('personal_field_birthplace')"
              type="text">
            </app-input-text>
          </div>
        </div>
      </div>
      <div formGroupName="personalDocs" class="person-members person-documents fields-grid">
        <app-input-mask
          formControlName="cpf"
          name="personalDocs.cpf"
          [field]="personFormGroup"
          class="field col-12 md:col-4 c-margin"
          [label]="translatePersonMembers.translate('personal_field_cpf')"
          mask="999.999.999-99">
        </app-input-mask>
        <app-input-text
          formControlName="rg"
          name="personalDocs.rg"
          [field]="personFormGroup"
          class="field col-12 md:col-4 c-margin"
          [label]="translatePersonMembers.translate('personal_field_rg')"
          type="text">
        </app-input-text>
        <app-input-date
          formControlName="birthDate"
          name="personalDocs.birthDate"
          [field]="personFormGroup"
          class="field col-12 md:col-4 c-margin"
          [label]="translatePersonMembers.translate('personal_field_birthdate')"
          type="date">
        </app-input-date>
      </div>
    </p-tabpanel>
    <p-tabpanel value="1">
      <div formGroupName="personalTelphone" class="person-members fields-grid">
        <app-input-mask
          formControlName="phone"
          name="personalTelphone.phone"
          [field]="personFormGroup"
          class="field col-12 md:col-6 c-margin"
          [label]="translatePersonMembers.translate('personal_field_phone')"
          mask="(99) 9999-9999">
        </app-input-mask>
        <app-input-mask
          formControlName="cellPhone"
          name="personalTelphone.cellPhone"
          [field]="personFormGroup"
          class="field col-12 md:col-6 c-margin"
          [label]="translatePersonMembers.translate('personal_field_personalPhone')"
          mask="(99) 9 9999-9999">
        </app-input-mask>
      </div>
      <div formGroupName="personalEmail" class="person-members contact-email fields-grid">
        <app-input-text
          formControlName="email"
          name="personalEmail.email"
          [field]="personFormGroup"
          class="field col-12 md:col-12 c-margin"
          [label]="translatePersonMembers.translate('personal_field_email')"
          type="email">
        </app-input-text>
      </div>
    </p-tabpanel>
    <p-tabpanel value="2">
      <div formGroupName="personAddress" class="person-members fields-grid">
        <app-input-mask
          formControlName="postalCode"
          name="personAddress.postalCode"
          [field]="personFormGroup"
          class="field col-12 md:col-3 c-margin"
          [label]="translatePersonMembers.translate('personal_field_postalCode')"
          mask="99999-999">
        </app-input-mask>
        <app-input-text
          formControlName="address"
          name="personAddress.address"
          [field]="personFormGroup"
          class="field col-12 md:col-9 c-margin"
          [label]="translatePersonMembers.translate('personal_field_address')"
          type="text">
        </app-input-text>
        <app-input-text
          formControlName="number"
          name="personAddress.number"
          [field]="personFormGroup"
          class="field col-12 md:col-4 c-margin"
          [label]="translatePersonMembers.translate('personal_field_number')"
          type="text">
        </app-input-text>
        <app-input-text
          formControlName="neighborhood"
          name="personAddress.neighborhood"
          [field]="personFormGroup"
          class="field col-12 md:col-4 c-margin"
          [label]="translatePersonMembers.translate('personal_field_neighborhood')"
          type="text">
        </app-input-text>
        <app-input-text
          formControlName="complement"
          name="personAddress.complement"
          [field]="personFormGroup"
          class="field col-12 md:col-4 c-margin"
          [label]="translatePersonMembers.translate('personal_field_complement')"
          type="text">
        </app-input-text>
        <app-auto-complete
          formControlName="city"
          name="personAddress.city"
          [field]="personFormGroup"
          class="field col-12 md:col-12 c-margin"
          [label]="translatePersonMembers.translate('personal_field_city')"
          route="city"
          optionLabel="name"
          type="text">
        </app-auto-complete>
      </div>
    </p-tabpanel>
    @if (showMinisterial) {
      <p-tabpanel value="3">
        <div formGroupName="personMember" class="fields-grid">
          <app-input-date
            formControlName="entryDate"
            name="personMember.entryDate"
            [field]="personFormGroup"
            class="field col-12 md:col-6 c-margin"
            [label]="translatePersonMembers.translate('personal_field_ingressDate')"
            type="date">
          </app-input-date>
          <app-input-date
            formControlName="dateBaptism"
            name="personMember.dateBaptism"
            [field]="personFormGroup"
            class="field col-12 md:col-6 c-margin"
            [label]="translatePersonMembers.translate('personal_field_baptismDate')"
            type="date">
          </app-input-date>
          <app-auto-complete
            formControlName="position"
            name="personMember.position"
            [field]="personFormGroup"
            class="field col-12 md:col-12 c-margin"
            [label]="translatePersonMembers.translate('personal_field_position')"
            route="positions"
            optionLabel="name"
            type="text">
          </app-auto-complete>
        </div>
      </p-tabpanel>
    }
  </p-tabpanels>
  </p-tabs>
    </div>
  </main>
</section>
