<app-loading [showLoading]="showLoading" />
<section class="register-page">
  <nav class="register-page__breadcrumb" aria-label="Breadcrumb">
    <p-breadcrumb [model]="breadcrumbItems" [home]="breadcrumbHome" />
  </nav>

  <header class="register-page__header">
    <div>
      <h1>{{ configuration.header }}</h1>
      <p>{{ translateService.translate('datatable_page_description') }}</p>
    </div>
  </header>

  <main class="register-page__content">
    <app-datatable
      (onRefresh)="onLoadAllData($event)"
      (onRegister)="onSelectedData($event)"
      [config]="datatable" />
  </main>
</section>
