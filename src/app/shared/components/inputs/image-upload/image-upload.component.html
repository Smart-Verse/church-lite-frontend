<div class="image-upload">
  <button
    type="button"
    class="image-upload__preview"
    (click)="onFileInput(fileInput)"
    aria-label="Selecionar foto">
    @if (imageUrl) {
      <img [src]="imageUrl" alt="Foto selecionada">
      <span class="image-upload__overlay">
        <i class="pi pi-camera"></i>
        Alterar foto
      </span>
    } @else {
      <span class="image-upload__placeholder">
        <span class="image-upload__icon"><i class="pi pi-camera"></i></span>
        <strong>Adicionar foto</strong>
        <small>JPG ou PNG, até 5 MB</small>
      </span>
    }
  </button>

  <input
    #fileInput
    type="file"
    (change)="onImageSelect($event)"
    accept="image/*"
    class="file-input" />

  <div class="image-upload__actions">
    <button
      type="button"
      pButton
      pRipple
      class="p-button-outlined image-upload__select"
      icon="pi pi-upload"
      [label]="imageUrl ? 'Substituir' : 'Selecionar'"
      (click)="onFileInput(fileInput)">
    </button>
    @if (imageUrl) {
      <button
        type="button"
        pButton
        pRipple
        class="p-button-outlined p-button-danger image-upload__delete"
        icon="pi pi-trash"
        aria-label="Remover foto"
        (click)="onDeleteImage()">
      </button>
    }
  </div>

  @if (cropVisible) {
    <div class="crop-dialog" role="dialog" aria-modal="true" aria-label="Recortar imagem">
      <div class="crop-dialog__backdrop" (click)="cancelCrop(fileInput)"></div>
      <section class="crop-dialog__panel">
        <header><div><strong>Ajustar imagem</strong><small>Arraste e redimensione para escolher o enquadramento.</small></div><button type="button" aria-label="Fechar" (click)="cancelCrop(fileInput)"><i class="pi pi-times"></i></button></header>
        <div class="crop-dialog__canvas">
          <image-cropper
            [imageChangedEvent]="imageChangedEvent"
            [maintainAspectRatio]="true"
            [aspectRatio]="cropAspectRatio || 1"
            [resizeToWidth]="cropResizeWidth"
            [onlyScaleDown]="true"
            output="blob"
            format="jpeg"
            (imageCropped)="onImageCropped($event)" />
        </div>
        <footer><button type="button" pButton class="p-button-outlined" label="Cancelar" (click)="cancelCrop(fileInput)"></button><button type="button" pButton label="Usar este recorte" icon="pi pi-check" [disabled]="!croppedImage" (click)="confirmCrop(fileInput)"></button></footer>
      </section>
    </div>
  }
</div>
