<p-floatLabel>
  <p-datepicker
    (ngModelChange)="onChange($event)"
    [ngModel]="value"
    [iconDisplay]="'input'"
    [showIcon]="true"
    [ngClass]="{'ng-invalid ng-dirty': !isValid}"
    appendTo="body"
      [pAutoFocus]="focus"
    [disabled]="disabled"
    [touchUI]="false"
    [showTime]="showTime"
    hourFormat="24"
    dateFormat="dd/mm/yy"
    [readonlyInput]="false"
    class="w-full"/>
  <label>{{label}}</label>
</p-floatLabel>
