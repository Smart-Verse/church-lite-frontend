<div class="sidebar-submenu">
  <ul>
    <div class="submenu-title" (click)="onColapsed(currentMenu)">
      <div class="icon">
        <i class="pi pi-angle-left"></i>
      </div>
      <div class="text">
        {{ currentMenu.name }}
      </div>
    </div>
    @if (currentMenu.submenu.length > 0) {
      @for (item of currentMenu.submenu; track item; let i = $index) {
        <li class="transition"
          [routerLink]="item.route === 'login' ? null : item.route"
          (click)="item.route === 'login' ? onLogout($event) : onContextMenu(item)">
          <div class="submenu-menu-text">
            <div>
              {{ item.name }}
            </div>
            @if (item.submenu) {
              <div>
                <i class="pi pi-angle-right"></i>
              </div>
            }
          </div>
        </li>
      }
    }

  </ul>
</div>
