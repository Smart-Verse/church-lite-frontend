@if (showSidebarMobile) {
  <div class="toolbar" (click)="onMobileOpenMenu()">
    <h3>SmartChurch</h3>
  </div>
}
@if (showSidebar) {
  <div class="sidebar" [class.expanded]="isExpanded">
    <ul class="menu-list">
      <div class="logo">
        <h3>S</h3>
      </div>
      <div class="menu-expanded">
        <div class="menu-expanded-icon">
          @for (item of menuItems; track item) {
            <li (click)="toggleMenu(item)"
              [routerLink]="item.route"
              [id]="item.name">
              <span class="indicator"></span>
              <i [ngClass]="item.iconClass" pTooltip="{{ item.tooltip }}"></i>
            </li>
          }
        </div>
        @if (isExpanded) {
          <div class="menu-expanded-submenu">
            <app-sidebar-submenu (colapsed)="closeMenu()" [menu]="currentMenu"></app-sidebar-submenu>
          </div>
        }
      </div>
      <div class="logout">
        <li class="logout-item">
          <div class="footer" >
            @if (!image) {
              <div class="user">User</div>
            }
            @if (image) {
              <img class="user" [src]="image">
            }
          </div>
        </li>
      </div>
    </ul>
  </div>
}
<div class="content" [class.menu-expanded]="isExpanded" (click)="closeMenu()">
  <router-outlet></router-outlet>
</div>
